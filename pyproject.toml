[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-practice-lab"
version = "0.1.0"
description = "A structured Python learning and practice repository"
requires-python = ">=3.11"
dependencies = []

[tool.pytest.ini_options]
testpaths = ["08_testing", "09_mini_projects"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py311"
